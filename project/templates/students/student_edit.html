<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.name }}ni tahrirlash</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Talaba ma'lumotlarini tahrirlash</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                {{ form.as_p }}
            </div>
            <div class="flex justify-between items-center pt-4">
                <a href="{% url 'student_detail' student.id %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition">
                    &larr; Bekor qilish
                </a>
                <button type="submit" class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded text-sm font-semibold transition">
                    Saqlash
                </button>
            </div>
        </form>
    </div>
</body>
</html>
